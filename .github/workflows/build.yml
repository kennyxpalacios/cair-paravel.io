name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS app (unsigned device build)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select newest stable Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi -e beta -e rc | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26+ found; using the image default."
          else
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CairParavel.xcodeproj \
            -scheme CairParavel \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1 | tee build.log

      - name: Summarize errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -100 || true
